version: '3.8'

# ==============================================================================
# OpenPDF Platform - Production Docker Compose Stack
# Multi-container orchestration for high-availability PDF processing
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy (Public Entrypoint)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: pdf_nginx
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    networks:
      - pdf_network

  # ----------------------------------------------------------------------------
  # Next.js 15 Frontend (Standalone Production Runner)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: pdf_web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_INTERNAL_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - pdf_network

  # ----------------------------------------------------------------------------
  # FastAPI API Gateway (Sandboxed Ingestion & Task Dispatch)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pdf_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pdf_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pdf_platform}
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_RAW_BUCKET=${S3_RAW_BUCKET:-pdf-raw-staging}
      - S3_ARTIFACT_BUCKET=${S3_ARTIFACT_BUCKET:-pdf-artifacts}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost", "https://localhost"]}
      - MAX_FILE_SIZE_BYTES=104857600
      - RETENTION_HOURS=2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - pdf_network

  # ----------------------------------------------------------------------------
  # Celery Background Worker (Isolated Engine Sandbox)
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: pdf_worker
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=512M,mode=1777
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - TMPDIR=/tmp
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pdf_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pdf_platform}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_RAW_BUCKET=${S3_RAW_BUCKET:-pdf-raw-staging}
      - S3_ARTIFACT_BUCKET=${S3_ARTIFACT_BUCKET:-pdf-artifacts}
    networks:
      - pdf_network

  # ----------------------------------------------------------------------------
  # Celery Beat (Ephemeral Retention Sweeper Scheduler)
  # ----------------------------------------------------------------------------
  beat:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: pdf_beat
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=128M,mode=1777
    command: ["celery", "-A", "apps.worker.src.celery_app", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - TMPDIR=/tmp
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pdf_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pdf_platform}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_RAW_BUCKET=${S3_RAW_BUCKET:-pdf-raw-staging}
      - S3_ARTIFACT_BUCKET=${S3_ARTIFACT_BUCKET:-pdf-artifacts}
    networks:
      - pdf_network

  # ----------------------------------------------------------------------------
  # PostgreSQL 16 (Relational Job & Token Store)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pdf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdf_platform}
      POSTGRES_USER: ${POSTGRES_USER:-pdf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdf_user} -d ${POSTGRES_DB:-pdf_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pdf_network

  # ----------------------------------------------------------------------------
  # Redis 7 (In-Memory Broker & Sliding Window Rate Limiter)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pdf_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel notice
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pdf_network

  # ----------------------------------------------------------------------------
  # MinIO (S3-Compatible Ephemeral Storage Cluster)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: pdf_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pdf_network

  # ----------------------------------------------------------------------------
  # MinIO Provisioner (Private Bucket Initializer)
  # ----------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: pdf_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID} ${S3_SECRET_ACCESS_KEY};
      /usr/bin/mc mb --ignore-existing local/${S3_RAW_BUCKET:-pdf-raw-staging};
      /usr/bin/mc mb --ignore-existing local/${S3_ARTIFACT_BUCKET:-pdf-artifacts};
      /usr/bin/mc anonymous set none local/${S3_RAW_BUCKET:-pdf-raw-staging};
      /usr/bin/mc anonymous set none local/${S3_ARTIFACT_BUCKET:-pdf-artifacts};
      echo 'MinIO production buckets provisioned.';
      exit 0;
      "
    networks:
      - pdf_network

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:

networks:
  pdf_network:
    driver: bridge
