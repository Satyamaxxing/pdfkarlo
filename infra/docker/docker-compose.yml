version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 - Relational Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pdf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdf_platform}
      POSTGRES_USER: ${POSTGRES_USER:-pdf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdf_password_secure}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdf_user} -d ${POSTGRES_DB:-pdf_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis 7 - Message Broker, Token Store & Cache
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pdf_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # MinIO - S3-Compatible Ephemeral Object Storage
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: pdf_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # MinIO Bucket Provisioner - Automatic bucket initialization
  # ----------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: pdf_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin};
      /usr/bin/mc mb --ignore-existing local/${S3_RAW_BUCKET:-pdf-raw-staging};
      /usr/bin/mc mb --ignore-existing local/${S3_ARTIFACT_BUCKET:-pdf-artifacts};
      /usr/bin/mc anonymous set none local/${S3_RAW_BUCKET:-pdf-raw-staging};
      /usr/bin/mc anonymous set none local/${S3_ARTIFACT_BUCKET:-pdf-artifacts};
      echo 'MinIO buckets provisioned.';
      exit 0;
      "

  # ----------------------------------------------------------------------------
  # FastAPI API Gateway
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: pdf_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pdf_user}:${POSTGRES_PASSWORD:-pdf_password_secure}@postgres:5432/${POSTGRES_DB:-pdf_platform}
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - S3_RAW_BUCKET=${S3_RAW_BUCKET:-pdf-raw-staging}
      - S3_ARTIFACT_BUCKET=${S3_ARTIFACT_BUCKET:-pdf-artifacts}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Celery Background Worker (Sandboxed Container)
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ../../apps/worker
      dockerfile: Dockerfile
    container_name: pdf_worker
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp/pdf_jobs:size=256M,mode=1777,noexec,nosuid,nodev
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pdf_user}:${POSTGRES_PASSWORD:-pdf_password_secure}@postgres:5432/${POSTGRES_DB:-pdf_platform}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - S3_RAW_BUCKET=${S3_RAW_BUCKET:-pdf-raw-staging}
      - S3_ARTIFACT_BUCKET=${S3_ARTIFACT_BUCKET:-pdf-artifacts}

  # ----------------------------------------------------------------------------
  # Celery Beat - 10-Minute Retention Sweeper Cron
  # ----------------------------------------------------------------------------
  beat:
    build:
      context: ../../apps/worker
      dockerfile: Dockerfile
    container_name: pdf_beat
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    command: ["celery", "-A", "src.celery_app", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pdf_user}:${POSTGRES_PASSWORD:-pdf_password_secure}@postgres:5432/${POSTGRES_DB:-pdf_platform}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - S3_RAW_BUCKET=${S3_RAW_BUCKET:-pdf-raw-staging}
      - S3_ARTIFACT_BUCKET=${S3_ARTIFACT_BUCKET:-pdf-artifacts}

volumes:
  postgres_data:
  redis_data:
  minio_data:
