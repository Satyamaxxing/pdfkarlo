name: Deploy to Cloudflare Pages

'on':
  push:
    branches:
      - main
  workflow_dispatch:

# Enforce minimal read permissions for repository contents
permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Next.js Static Export
        working-directory: apps/web
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/out --project-name=pdfkarlo --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment Summary
        run: |
          echo "### 🚀 Cloudflare Pages Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Project:** \`pdfkarlo\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`main\` (Production)" >> $GITHUB_STEP_SUMMARY
          echo "- **Production URL:** [https://pdfkarlo.pages.dev](https://pdfkarlo.pages.dev)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
